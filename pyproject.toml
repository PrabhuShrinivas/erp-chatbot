[project]
name = "erp-qa"
version = "0.1.0"
description = "ERP Natural-Language Business Q&A System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "openai>=1.30.0",
    "instructor>=1.3.0",
    "python-dotenv>=1.0.1",
    "greenlet>=3.0.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0"
]
